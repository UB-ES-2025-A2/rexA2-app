[pytest]
pythonpath = .
testpaths = backend/tests
filterwarnings =
    ignore:.*Please use `import python_multipart`.*:PendingDeprecationWarning
    ignore:.*'crypt' is deprecated.*:DeprecationWarning:passlib
    ignore:.*utcnow\(\) is deprecated.*:DeprecationWarning:jose.jwt
    ignore:.*ast.NameConstant is deprecated.*:DeprecationWarning:reportlab
